name: Game tests

# Boots real games, so it needs a self-hosted Windows runner with a desktop session, the starting installs and CKAN.
# Set these repository variables to paths on that runner:
#   KSP_DIR                   stock KSP 1.12.5 install the build references
#   KSPHARNESS_HOME           harness home, on the same volume as the starting installs
#   CKAN_EXE                  CKAN 1.36 or later
#   KSPHARNESS_TEST_STOCK     stock starting install
#   KSPHARNESS_TEST_RETOOLED  KSP Retooled starting install

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: game-tests
  cancel-in-progress: false

jobs:
  game-tests:
    runs-on: [self-hosted, windows, ksp-harness]
    timeout-minutes: 90
    env:
      KSP_DIR: ${{ vars.KSP_DIR }}
      KSPHARNESS_HOME: ${{ vars.KSPHARNESS_HOME }}
      CKAN_EXE: ${{ vars.CKAN_EXE }}
      KSPHARNESS_TEST_STOCK: ${{ vars.KSPHARNESS_TEST_STOCK }}
      KSPHARNESS_TEST_RETOOLED: ${{ vars.KSPHARNESS_TEST_RETOOLED }}
      KSPHARNESS_RETOOLED_DIR: ${{ vars.KSPHARNESS_TEST_RETOOLED }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: dotnet build KspHarness.slnx -c Release

      # With KSP_DIR and the starting installs set, this also runs the offline tests that compile against real installs.
      - name: Test
        run: >
          dotnet test KspHarness.slnx -c Release --no-build
          --logger "trx" --logger "console;verbosity=normal" --results-directory TestResults

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: game-test-results
          path: TestResults
