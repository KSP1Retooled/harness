name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # KSP 1.12.5 assemblies stripped to their public surface, enough to compile against.
  KSP_LIBS_URL: https://github.com/KSPModdingLibs/KSPLibs/raw/main/KSP-1.12.5.zip
  KSP_DIR: ${{ github.workspace }}/ksp

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Download KSP assemblies
        run: |
          curl -sSfL "$KSP_LIBS_URL" -o "$RUNNER_TEMP/ksp.zip"
          unzip -q "$RUNNER_TEMP/ksp.zip" -d "$KSP_DIR"

      - name: Build
        run: dotnet build KspHarness.slnx -c Release
